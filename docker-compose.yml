services:
  db:
    image: mariadb:11
    environment:
      MYSQL_DATABASE: aipersonnel
      MYSQL_USER: aipersonnel
      MYSQL_PASSWORD: aipersonnel
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    volumes:
      - aipersonnel_db:/var/lib/mysql

  platform:
    build: ./platform
    environment:
      APP_ENV: dev
      DATABASE_URL: mysql://aipersonnel:aipersonnel@db:3306/aipersonnel
      HR_PAYROLL_WORKER_URL: http://hr-payroll-worker:8050
      APP_DOMAIN: aipersonnel.online
    ports:
      - "8088:80"
    depends_on:
      - db
      - hr-payroll-worker

  hr-payroll-worker:
    build: ./workers/hr_payroll_worker
    ports:
      - "8050:8050"

volumes:
  aipersonnel_db: